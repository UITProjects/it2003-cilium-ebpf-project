# Selected workload: app=frontend, ServiceAccount=frontend (verified against Deployment).
# frontend-external is type LoadBalancer and also allocates NodePort 30183.
# Experiment: NodeIP:30183 -> frontend Pod TCP 8080; alternative: VIP:80.
# This Pod policy uses port 8080; it does not create/change the Service type.
# Do not use this as an Ingress-controller policy.
# 'world' permits external clients; this is NOT a client IP allowlist.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: boutique-frontend-external
  namespace: microservices-google-demo
spec:
  endpointSelector:
    matchLabels:
      k8s:app: frontend
      k8s:io.cilium.k8s.policy.serviceaccount: frontend
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
