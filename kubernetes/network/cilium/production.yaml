# https://artifacthub.io/packages/helm/cilium/cilium/1.20.1?modal=values
kubeProxyReplacement: true
namespaceOverride: "kube-system"
routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: "192.168.40.160"
k8sServicePort: "6443"
autoDirectNodeRoutes: true
bpf:
  masquerade: true
ipam:
  # -- Configure IP Address Management mode.
  # ref: https://docs.cilium.io/en/stable/network/concepts/ipam/
  mode: "kubernetes"
operator:
  replicas: 1
  dashboards:
    enabled: true
  prometheus:
    metricsService: true
    enabled: true
    serviceMonitor:
      enabled: true
l2announcements:
  enabled: true
hubble:
  enabled: true
  relay:
    enabled: true
    tls:
      server:
        enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
  ui:
    enabled: true
    service:
      type: "LoadBalancer"
      annotations:
        lbipam.cilium.io/ips: "192.168.40.132"
  metrics:
    dashboards:
      enabled: true
envoy:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
prometheus:
  metricsService: true
  enabled: true
  port: 9962
  serviceMonitor:
    # This requires the prometheus CRDs to be available (see https://github.com/prometheus-operator/prometheus-operator/blob/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml)
    enabled: true
dashboards:
  enabled: true
