# Selected workload: app=cartservice, ServiceAccount=cartservice (verified against Deployment).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: boutique-cartservice
  namespace: microservices-google-demo
spec:
  endpointSelector:
    matchLabels:
      k8s:app: cartservice
      k8s:io.cilium.k8s.policy.serviceaccount: cartservice
      k8s:io.kubernetes.pod.namespace: microservices-google-demo
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: frontend
            k8s:io.cilium.k8s.policy.serviceaccount: frontend
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
        - matchLabels:
            k8s:app: checkoutservice
            k8s:io.cilium.k8s.policy.serviceaccount: checkoutservice
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
      toPorts:
        - ports:
            - port: "7070"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: redis-cart
            k8s:io.cilium.k8s.policy.serviceaccount: default
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
