apiVersion: v1
kind: Namespace
metadata:
  name: e1-bench
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e1-pause
  namespace: e1-bench
spec:
  replicas: 3
  selector:
    matchLabels:
      app: e1-pause
  template:
    metadata:
      labels:
        app: e1-pause
    spec:
      terminationGracePeriodSeconds: 0
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: e1-pause
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.10
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            cpu: 1000m
            memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-server
  namespace: e1-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-server
  template:
    metadata:
      labels:
        app: fortio-server
        role: e1-fortio
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: fortio-client
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args:
        - server
        - -http-port
        - '8080'
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
        resources:
          requests:
            cpu: 1000m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 256Mi
      nodeSelector:
        kubernetes.io/hostname: it-2003-ubuntu2404-1
---
apiVersion: v1
kind: Service
metadata:
  name: fortio-server
  namespace: e1-bench
spec:
  type: ClusterIP
  selector:
    app: fortio-server
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-client
  namespace: e1-bench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-client
  template:
    metadata:
      labels:
        app: fortio-client
        role: e1-fortio
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: fortio-server
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args:
        - server
        - -http-port
        - '8080'
        resources:
          requests:
            cpu: 500m
            memory: 64Mi
          limits:
            cpu: 2000m
            memory: 512Mi
      nodeSelector:
        kubernetes.io/hostname: it-2003-ubuntu2404-2
