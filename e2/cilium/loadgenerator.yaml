# Selected workload: app=loadgenerator, ServiceAccount=loadgenerator (verified against Deployment).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: boutique-loadgenerator
  namespace: microservices-google-demo
spec:
  endpointSelector:
    matchLabels:
      k8s:app: loadgenerator
      k8s:io.cilium.k8s.policy.serviceaccount: loadgenerator
      k8s:io.kubernetes.pod.namespace: microservices-google-demo
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app: frontend
            k8s:io.cilium.k8s.policy.serviceaccount: frontend
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
