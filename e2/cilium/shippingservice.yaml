# Selected workload: app=shippingservice, ServiceAccount=shippingservice (verified against Deployment).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: boutique-shippingservice
  namespace: microservices-google-demo
spec:
  endpointSelector:
    matchLabels:
      k8s:app: shippingservice
      k8s:io.cilium.k8s.policy.serviceaccount: shippingservice
      k8s:io.kubernetes.pod.namespace: microservices-google-demo
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: frontend
            k8s:io.cilium.k8s.policy.serviceaccount: frontend
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
        - matchLabels:
            k8s:app: checkoutservice
            k8s:io.cilium.k8s.policy.serviceaccount: checkoutservice
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
