
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: dvwa-file-debug
spec:
  kprobes:
    - call: security_file_permission
      syscall: false
      args:
        - index: 0
          type: file
        - index: 1
          type: int
      selectors:
        - matchArgs:
            - index: 1
              operator: Mask
              values:
                - "4"
