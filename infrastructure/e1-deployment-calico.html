.legend thead th{color:var(--muted);font-weight:500;font-size:.85rem;border-top:none}
.legend tbody th{font-weight:500;white-space:nowrap}
.legend td.mono{white-space:nowrap}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:9px;vertical-align:-2px}

.sw-svc{background:color-mix(in srgb,var(--svc) 22%,transparent);border:1.6px solid var(--svc)}

.note{color:var(--muted);font-size:.88rem;max-width:90ch;margin:16px 0 0}
.table-wrap{overflow-x:auto}

@media print{:root{--bg:#fff;--panel:#fff}body{background:#fff}main{padding:0}figure{border-color:#ccc}}
.cp{opacity:.85}
.empty{stroke-dasharray:4 3;fill:none}
svg .svc-txt{fill:var(--svc)}
svg .lbtxt{font-size:13px;fill:var(--net);font-weight:500}
.sw-lb{background:var(--net-bg);border:1.6px dashed var(--net)}
.chip{display:inline-block;font-size:.75rem;line-height:1;padding:3px 7px;border-radius:999px;border:1px solid var(--flow);color:var(--flow);vertical-align:1px;white-space:nowrap}
.legend td{white-space:normal}
footer{display:none}

.chip{border-color:var(--muted);color:var(--muted)}
.chip.warn{border-color:var(--flow);color:var(--flow)}

<header><h1>E1 deployment, setup A: Calico + kube-proxy (iptables)</h1><p>Cluster it2003-calico: three Proxmox VMs on their own private subnet. Test pods are pinned with the bench-role label, and Service rules are counted on the client worker.</p></header>

<thead><tr><th scope="col">Item</th><th scope="col">Range</th><th scope="col">Notes</th></tr></thead><tbody>
<tr><th scope="row"><span class="sw sw-net" aria-hidden="true"></span>Node network</th><td><span class="mono" data-k="calico.nodeCidr">192.168.50.0/24</span></td><td>Private Proxmox bridge subnet for this cluster's 3 VMs. <span class="mono">.160</span> control plane, <span class="mono">.161</span> server, <span class="mono">.162</span> client.</td></tr>
<tr><th scope="row"><span class="sw sw-pod" aria-hidden="true"></span>Pod CIDR</th><td><span class="mono" data-k="calico.podCidr">10.244.0.0/16</span> <span class="chip" data-k="calico.podCidrStatus">check IPPool</span></td><td>kubeadm podSubnet. The Calico IPPool should use the same range and hands it out to nodes as /26 blocks.</td></tr>
<tr><th scope="row"><span class="sw sw-svc" aria-hidden="true"></span>Service CIDR</th><td><span class="mono" data-k="calico.svcCidr">110.96.0.0/12</span> <span class="chip warn" data-k="calico.svcCidrStatus">public range</span></td><td>kubeadm serviceSubnet, as reported by the cluster. This is a public range and differs from the Cilium cluster's 10.96.0.0/12. Same /12 size, about 1M virtual IPs.</td></tr>
<tr><th scope="row"><span class="sw sw-lb" aria-hidden="true"></span>LoadBalancer IPs</th><td><span class="mono" data-k="calico.lbPool">None (ClusterIP only)</span></td><td>Calico has no LB IPAM. Tests use ClusterIP only; use kubectl port-forward for UIs.</td></tr>
<tr><th scope="row"><span class="sw sw-lookup" aria-hidden="true"></span>Service lookup</th><td class="mono">iptables-save -t nat | wc -l</td><td>iptables NAT chains on the client node, walked rule by rule for the first packet of each new connection.</td></tr>
<tr><th scope="row"><span class="sw sw-flow" aria-hidden="true"></span>Test flow</th><td class="mono">-keepalive=false</td><td>fortio client to ClusterIP Service to fortio server, one new connection per request.</td></tr>
</tbody></table></div><p class="note">Calico cluster check: kubeadm reports <span class="mono">podSubnet 10.244.0.0/16</span> and <span class="mono">serviceSubnet 110.96.0.0/12</span>. The Service range is a public block (110.96.0.0 – 110.111.255.255), not the private 10.96.0.0/12 used on the Cilium cluster, so pods there cannot reach real hosts in that block. Rule counts in E1 depend on the number of Services, not on the range, so the benchmark itself is unaffected; record it under known differences or rebuild the cluster with 10.96.0.0/12. The Calico IPPool has not been checked yet: <span class="mono">kubectl --context it2003@calico get ippools.crd.projectcalico.org -o wide</span>.</p></figure></div>
</main>
<script>
const get = p => p.split('.').reduce((o, k) => (o == null ? o : o[k]), CONFIG);
document.querySelectorAll('[data-k]').forEach(el => { const v = get(el.dataset.k); if (v !== undefined) el.textContent = v; });
document.querySelectorAll('.chip[data-k]').forEach(el => { if (!el.textContent.trim()) el.style.display = 'none'; });
</script>
