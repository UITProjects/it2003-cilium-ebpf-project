apiVersion: v1
kind: Namespace
metadata:
  name: dvwa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: dvwa
spec:
  replicas: 1
  selector:
    matchLabels: { app: dvwa }
  template:
    metadata:
      labels: { app: dvwa }
    spec:
      containers:
      - name: dvwa
        image: ghcr.io/digininja/dvwa:latest
        ports: [ { containerPort: 80, name: http } ]
        env:
        - { name: DB_SERVER, value: "127.0.0.1" }
        - { name: DB_DATABASE, value: "dvwa" }
        - { name: DB_USERNAME, value: "dvwa" }
        - { name: DB_PASSWORD, value: "p@ssw0rd" }
      - name: db
        image: mariadb:10
        env:
        - { name: MYSQL_ROOT_PASSWORD, value: "dvwa" }
        - { name: MYSQL_DATABASE, value: "dvwa" }
        - { name: MYSQL_USER, value: "dvwa" }
        - { name: MYSQL_PASSWORD, value: "p@ssw0rd" }
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: dvwa
  annotations:
    lbipam.cilium.io/ips: 192.168.40.140
spec:
  type: LoadBalancer
  selector: { app: dvwa }
  ports: [ { port: 80, targetPort: http, name: http } ]
