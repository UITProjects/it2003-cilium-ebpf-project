---
- name: Configure 12GB swap
  hosts: it2003_lab
  become: true
  tasks:
  - name: Check if swapfile exists
    stat:
      path: /swapfile
    register: swap_file_check

  - name: Create 12GB swapfile
    command: fallocate -l 12G /swapfile
    when: not swap_file_check.stat.exists

  - name: Set swapfile permissions
    file:
      path: /swapfile
      mode: '0600'

  - name: Format swapfile
    command: mkswap /swapfile
    when: not swap_file_check.stat.exists

  - name: Enable swap
    command: swapon /swapfile
    when: not swap_file_check.stat.exists

  - name: Persist swap in fstab
    lineinfile:
      path: /etc/fstab
      line: '/swapfile none swap sw 0 0'
      state: present

  - name: Set swappiness to 10
    ansible.posix.sysctl:
      name: vm.swappiness
      value: '10'
      state: present
      reload: true
