---
- name: Disable and remove swap for Kubernetes
  hosts: it2003_lab
  become: true
  tasks:
    - name: Disable all active swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Remove swapfile entry from fstab
      lineinfile:
        path: /etc/fstab
        regexp: '^/swapfile\s'
        state: absent

    - name: Delete the swapfile
      file:
        path: /swapfile
        state: absent

    - name: Remove custom swappiness setting
      ansible.posix.sysctl:
        name: vm.swappiness
        state: absent
        reload: true
      ignore_errors: true