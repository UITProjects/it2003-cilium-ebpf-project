---
- name: Configure DNAT port-forwarding to it-2003 VMs
  hosts: proxmox-server
  become: true
  vars:
    external_interface: "vmbr0"
    internal_bridge: "it2003"
    ssh_internal_port: 22
    vm_count: 3
    vm_ip_base: "192.168.40."
    vm_ip_start: 160
    external_port_base: 2160

  tasks:
    - name: Ensure iptables-persistent is installed
      ansible.builtin.apt:
        name: iptables-persistent
        state: present

    - name: Enable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: DNAT external port to each VM's SSH port
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "{{ external_interface }}"
        protocol: tcp
        destination_port: "{{ external_port_base + item }}"
        jump: DNAT
        to_destination: "{{ vm_ip_base }}{{ vm_ip_start + item }}:{{ ssh_internal_port }}"
        action: insert
        rule_num: 1
        state: present
        comment: "DNAT SSH: ext {{ external_port_base + item }} -> it-2003-ubuntu2404-{{ item }}"
      loop: "{{ range(0, vm_count) | list }}"

    - name: Allow forwarded traffic to reach the VMs
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: tcp
        destination: "{{ vm_ip_base }}{{ vm_ip_start + item }}"
        destination_port: "{{ ssh_internal_port }}"
        jump: ACCEPT
        action: insert
        rule_num: 1
        state: present
        comment: "Allow forwarded SSH to it-2003-ubuntu2404-{{ item }}"
      loop: "{{ range(0, vm_count) | list }}"

    - name: DNAT external port 2194 to OpenVPN server (192.168.40.10:1194 UDP)
      ansible.builtin.iptables:
        table: nat
        chain: PREROUTING
        in_interface: "vmbr0"
        protocol: udp
        destination_port: 2194
        jump: DNAT
        to_destination: "192.168.40.10:1194"
        action: insert
        rule_num: 1
        state: present
        comment: "IT2003: DNAT OpenVPN: ext 2194/udp -> 192.168.40.10:1194"
    - name: Allow forwarded traffic to reach the OpenVPN server
      ansible.builtin.iptables:
        chain: FORWARD
        protocol: udp
        destination: "192.168.40.10"
        destination_port: 2194
        jump: ACCEPT
        action: insert
        rule_num: 1
        state: present
        comment: "IT2003: Allow forwarded OpenVPN UDP to 192.168.40.10"
    - name: Save iptables rules persistently
      ansible.builtin.command: netfilter-persistent save
      changed_when: true
    - name: Add static route file for VPN client subnet
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/vpn-routes
        content: |
          # Managed by Ansible - static route for OpenVPN client subnet
          iface it2003
            post-up ip route replace 10.8.0.0/24 via 192.168.40.10
            pre-down ip route del 10.8.0.0/24 via 192.168.40.10 || true
        owner: root
        group: root
        mode: "0644"
    - name: Apply the route immediately (idempotent)
      ansible.builtin.command: ip route replace 10.8.0.0/24 via 192.168.40.10
      changed_when: true