apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-cart-policy
  namespace: microservices-google-demo

spec:
  endpointSelector:
    matchLabels:
      app: redis-cart

  ingress:
    - fromEndpoints:
        - matchLabels:
            app: cartservice

      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP