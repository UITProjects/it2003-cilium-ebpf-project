# https://artifacthub.io/packages/helm/cilium/cilium/1.20.1?modal=values
kubeProxyReplacement: true
namespaceOverride: "kube-system"
routingMode: native
ipv4NativeRoutingCIDR: 10.244.0.0/16
k8sServiceHost: "192.168.40.160"
k8sServicePort: "6443"
autoDirectNodeRoutes: true
bpf:
  masquerade: true
ipam:
  # -- Configure IP Address Management mode.
  # ref: https://docs.cilium.io/en/stable/network/concepts/ipam/
  mode: "kubernetes"
operator:
  replicas: 1

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
    service:
      type: "LoadBalancer"
      annotations:
        metallb.universe.tf/LoadBalancerIPs: "192.168.40.131"
