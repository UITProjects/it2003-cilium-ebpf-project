# Selected workload: app=adservice, ServiceAccount=adservice (verified against Deployment).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: boutique-adservice
  namespace: microservices-google-demo
spec:
  endpointSelector:
    matchLabels:
      k8s:app: adservice
      k8s:io.cilium.k8s.policy.serviceaccount: adservice
      k8s:io.kubernetes.pod.namespace: microservices-google-demo
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app: frontend
            k8s:io.cilium.k8s.policy.serviceaccount: frontend
            k8s:io.kubernetes.pod.namespace: microservices-google-demo
      toPorts:
        - ports:
            - port: "9555"
              protocol: TCP
